name: R source syntax
on:
  push:
    branches:
      - main
      - feature/ieabank-2026-10-model-gui
  pull_request:
  workflow_dispatch:
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse Shiny entrypoint
        run: Rscript -e 'invisible(parse(file="app.R")); cat("R syntax OK\\n")'
